[build]
  base = "dashboard"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"
  # Note: Environment variables for this project are automatically
  # synced from Doppler (project: disrupting-alpha, config: production).
  # Do not hardcode them in netlify.toml directly.


[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

