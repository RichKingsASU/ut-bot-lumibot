version: '3.8'

services:
  trading-bot:
    # NOT started by a bare `docker compose up -d`. On k2 the bot runs natively
    # under systemd as da-trading-bot.service (ExecStart=venv/bin/python main.py),
    # and this container runs the identical CMD ["python", "main.py"] against the
    # same .env -- starting both yields two bots double-writing bar_log,
    # signal_log and paper_trades, and duplicate Telegram alerts.
    # scripts/start_all.sh has always excluded it; this makes that explicit.
    # To run the containerised bot deliberately (on a host with no systemd unit):
    #   docker compose --profile standalone up -d trading-bot
    profiles: ["deprecated-legacy-trading"]
    build: .
    container_name: ut-bot-lumibot
    restart: always
    env_file:
      - .env
    ports:
      # Loopback-only, matching every other service here. Was 8000:8000, which
      # published the bot's HTTP surface on all interfaces.
      - "127.0.0.1:8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"   # ILP ingestion — publish to host so host-side tooling/tests can write
    volumes:
      - /mnt/tick-storage/questdb:/root/.questdb
    restart: unless-stopped

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - /mnt/tick-storage/qdrant:/qdrant/storage
    restart: unless-stopped

  tick-collector:
    image: python:3.11-slim
    container_name: tick-collector
    restart: unless-stopped
    depends_on:
      - nats
      - questdb
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    command: >
      bash -c "pip install --no-cache-dir -r requirements-production.txt && python run_tick_collector.py"

  news-collector:
    image: python:3.11-slim
    container_name: news-collector
    restart: unless-stopped
    depends_on:
      - nats
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    command: >
      bash -c "pip install --no-cache-dir -r requirements-production.txt && python run_news_collector.py"

  sentiment-scorer:
    image: python:3.11-slim
    container_name: sentiment-scorer
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install transformers torch sentence-transformers qdrant-client requests python-dotenv nats-py httpx -q && python run_sentiment_scorer.py"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - nats
    deploy:
      resources:
        limits:
          memory: 4G

  vector-store:
    image: python:3.11-slim
    container_name: vector-store
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install sentence-transformers qdrant-client requests python-dotenv nats-py -q && python run_vector_store.py"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - nats
      - qdrant
    deploy:
      resources:
        limits:
          memory: 2G
