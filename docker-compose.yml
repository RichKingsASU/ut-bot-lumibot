version: '3.8'

services:
  trading-bot:
    build: .
    container_name: ut-bot-lumibot
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"
      - "8812:8812"
    volumes:
      - /mnt/tick-storage/questdb:/root/.questdb
    restart: unless-stopped

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - /mnt/tick-storage/qdrant:/qdrant/storage
    restart: unless-stopped

  tick-collector:
    image: python:3.11-slim
    container_name: tick-collector
    restart: unless-stopped
    depends_on:
      - nats
      - questdb
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python run_tick_collector.py"

