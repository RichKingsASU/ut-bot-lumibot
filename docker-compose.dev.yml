version: '3.8'

services:
  trading-bot:
    profiles: ["trading-dev"]
    build: 
      context: .
      target: bot
    container_name: ut-bot-executor-dev
    env_file: .env
    volumes:
      - .:/app
      - /run/disrupting-alpha:/run/disrupting-alpha
    ports:
      - "8000:8000"
    # Legacy Lumibot writer is retained for development inspection only. Its
    # broker mutation boundary still requires the shared host execution lease.
    command: python src/trading/executor.py

  dashboard:
    build:
      context: .
      target: frontend-builder # Use builder stage or a separate node dev image
    container_name: ut-bot-dashboard-dev
    working_dir: /app/dashboard
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./dashboard:/app/dashboard
    command: npm run dev -- --host
