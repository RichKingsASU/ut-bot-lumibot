pipeline:
  name: disrupting-alpha-ci
  identifier: disrupting_alpha_ci
  projectIdentifier: default
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run Security Scan and Tests
                  identifier: Run_Security_Scan_and_Tests
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.12
                    shell: Sh
                    envVariables:
                      DOPPLER_TOKEN: <+secrets.getValue("DOPPLER_TOKEN")>
                    command: |-
                      # Install dependencies
                      curl -Ls https://cli.doppler.com/install.sh | sh
                      pip install uv
                      uv pip install --system -r requirements.txt

                      # Security scan.
                      #
                      # Previously this matched only ALPACA_* assignments in
                      # *.py files, so it passed while two live Doppler service
                      # tokens sat in the repo -- one in systemd/da-doppler.conf
                      # and one in docs/harness-doppler-setup.md. Neither is a
                      # .py file and neither is an ALPACA_ key.
                      #
                      # Scan every tracked file and match on credential
                      # PREFIXES, which is what actually identifies a leaked
                      # secret, rather than on variable names.
                      if git ls-files -z | xargs -0 grep -nIE \
                        -e 'dp\.st\.[A-Za-z0-9._-]{20,}' \
                        -e 'BEGIN [A-Z ]*PRIVATE KEY' \
                        -e 'postgresql://[^ ]+:[^@ <]+@' \
                        -e 'sk-[A-Za-z0-9]{24,}' \
                        -e 'AIza[A-Za-z0-9_-]{30,}' \
                        -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
                        -e 'ghp_[A-Za-z0-9]{30,}' \
                        -e 'AKIA[A-Z0-9]{16}' \
                        -e 'ALPACA_API_KEY\s*=\s*"[A-Z0-9]{10,}"' \
                        -e 'ALPACA_API_SECRET\s*=\s*"[A-Za-z0-9]{20,}"' \
                        | grep -vE '\.example:|\.template:|placeholder|<[A-Za-z-]+>'; then
                        echo "ERROR: credential-shaped string found in a tracked file"
                        echo "If this is a placeholder, use <angle-brackets> or a .example/.template file."
                        exit 1
                      fi

                      echo "Security scan passed — no hardcoded secrets found"

                      # Unit tests via Doppler
                      doppler run --project disrupting-alpha --config prd -- pytest tests/ backtests/tests/ -v

                      # Strict Mode validation via Doppler
                      echo "Verifying strict mode data provenance enforcement..."
                      if doppler run --project disrupting-alpha --config prd -- python scripts/run_options_backtest.py --symbol SPY 2>&1 | grep -q "SyntheticDataError"; then
                        echo "✓ Options backtester correctly failed in strict mode"
                      else
                        echo "FAILED: Options backtester did not enforce strict mode!"
                        exit 1
                      fi
                      
                      if PYTHONPATH=. doppler run --project disrupting-alpha --config prd -- python scripts/backtest_hmm_switching.py --symbol SPY 2>&1 | grep -q "SyntheticDataError"; then
                        echo "✓ HMM backtester correctly failed in strict mode"
                      else
                        echo "FAILED: HMM backtester did not enforce strict mode!"
                        exit 1
                      fi
                      
                      if PYTHONPATH=. doppler run --project disrupting-alpha --config prd -- python scripts/simulate_decay_recovery.py 2>&1 | grep -q "SyntheticDataError"; then
                        echo "✓ Decay simulator correctly failed in strict mode"
                      else
                        echo "FAILED: Decay simulator did not enforce strict mode!"
                        exit 1
                      fi
              - step:
                  type: Run
                  name: Run Dashboard Tests
                  identifier: Run_Dashboard_Tests
                  spec:
                    connectorRef: account.harnessImage
                    image: node:20
                    shell: Sh
                    command: |-
                      cd dashboard
                      npm ci
                      npm run test
