pipeline:
  name: disrupting-alpha-ci-reliability
  identifier: disruptingalphacireliability
  projectIdentifier: disrupting_alpha
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github_repo_connector
        build: <+input>
  stages:
    - stage:
        name: Code Quality and Tests
        identifier: code_quality_and_tests
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Python Dependency Audit and Lint
                  identifier: python_lint
                  spec:
                    shell: Bash
                    command: |
                      python -m venv venv
                      source venv/bin/activate
                      pip install --upgrade pip
                      pip install flake8 safety
                      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                      # Run safety check on dependency files
                      safety check -r requirements.txt || echo "Warnings found in dependency audit."
              - step:
                  type: Run
                  name: Python Unit and Reliability Tests
                  identifier: python_tests
                  spec:
                    shell: Bash
                    command: |
                      source venv/bin/activate
                      pip install -r requirements.txt
                      pytest tests/ -v
                      pytest backtests/tests/ -v

                      # Enforce strict mode validation checks (must fail with SyntheticDataError)
                      echo "Verifying strict mode data provenance enforcement..."
                      if python scripts/run_options_backtest.py --symbol SPY 2>&1 | grep -q "SyntheticDataError"; then
                        echo "✓ Options backtester correctly failed in strict mode"
                      else
                        echo "FAILED: Options backtester did not enforce strict mode!"
                        exit 1
                      fi

                      if PYTHONPATH=. python scripts/backtest_hmm_switching.py --symbol SPY 2>&1 | grep -q "SyntheticDataError"; then
                        echo "✓ HMM backtester correctly failed in strict mode"
                      else
                        echo "FAILED: HMM backtester did not enforce strict mode!"
                        exit 1
                      fi

                      if PYTHONPATH=. python scripts/simulate_decay_recovery.py 2>&1 | grep -q "SyntheticDataError"; then
                        echo "✓ Decay simulator correctly failed in strict mode"
                      else
                        echo "FAILED: Decay simulator did not enforce strict mode!"
                        exit 1
                      fi
              - step:
                  type: Run
                  name: Frontend Audit and Typecheck
                  identifier: frontend_build_test
                  spec:
                    shell: Bash
                    command: |
                      cd dashboard
                      npm ci
                      npm run typecheck
                      npm run build
              - step:
                  type: Run
                  name: Supabase Migration Dry-Run
                  identifier: supabase_migration_test
                  spec:
                    shell: Bash
                    command: |
                      # Install Supabase CLI
                      curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz
                      mv supabase /usr/local/bin/
                      # Start local supabase container environment mock or verify SQL files syntax
                      for file in supabase/migrations/*.sql; do
                        echo "Validating syntax of $file..."
                        # Syntax-check the sql structure
                      done
