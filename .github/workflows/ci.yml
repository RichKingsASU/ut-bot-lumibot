name: Approved Stack CI
on:
  push:
  pull_request:
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_DB: lumibot_test, POSTGRES_USER: lumibot, POSTGRES_PASSWORD: test-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumibot -d lumibot_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-more-than-fifty-characters-long-and-not-production
      DJANGO_ALLOWED_HOSTS: localhost
      DATABASE_URL: postgresql://lumibot:test-only-password@localhost:5432/lumibot_test
      DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.7', cache: pip}
      - run: python -m pip install --requirement requirements.txt
      - run: python manage.py check
      - run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test tests_django --verbosity 2
      - run: python manage.py collectstatic --noinput
      - name: Assert approved production stack
        run: |
          ! rg -i 'flask|supabase|playwright|react' config accounts operations trading templates requirements.txt Dockerfile.django docker-compose.production.yml
      - name: Compile production source
        run: python -m compileall -q config accounts operations trading
